appId: org.neweditor.desktop
productName: NewEditor
directories:
  output: dist
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
npmRebuild: true
linux:
  target: AppImage
  category: Utility
win:
  target: nsis
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
